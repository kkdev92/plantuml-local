name: Publish Extension

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npx @vscode/vsce package --no-dependencies --out plantuml-local.vsix

      - name: Verify VSIX contents and render from the package
        run: node scripts/verify-vsix.mjs plantuml-local.vsix

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath plantuml-local.vsix -p ${{ secrets.VSCE_PAT }}
