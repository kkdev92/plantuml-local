name: Publish Extension

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Publishing to the Marketplace waits for an approval. The environment also
    # restricts what may deploy to it to `v*` tags, which is the ref every
    # release this workflow has ever run on.
    #
    # `VSCE_PAT` is still a repository secret, so this gates *when* it is used,
    # not who can reference it. Moving the secret onto this environment is the
    # step that would do that, and needs the token value.
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npx @vscode/vsce package --no-dependencies --out plantuml-local.vsix

      - name: Verify VSIX contents and render from the package
        run: node scripts/verify-vsix.mjs plantuml-local.vsix

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath plantuml-local.vsix -p ${{ secrets.VSCE_PAT }}
