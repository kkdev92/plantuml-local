version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        # The engine comes in a pull request of its own: it is pinned to one
        # version, and an update is taken only once the engine-behaviour tests
        # in test/integration/worker.test.ts pass or are adjusted on purpose.
        exclude-patterns:
          - "@plantuml/core"

    ignore:
      # Each of these is turned down on purpose, so the reasons live here
      # instead of being rediscovered every week.

      # typescript 7.x: `typescript-eslint` declares `typescript >=4.8.4 <6.1.0`,
      # and type-aware linting is what `lint` runs — so 7.x fails the lane
      # outright rather than degrading. Drop this once that peer range widens.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

      # @types/vscode moves by hand, in the same change as engines.vscode:
      # `vsce package` refuses types newer than the floor, so a bump on its own
      # turns the package lane red. The floor follows @kkdev92/vscode-ext-kit's,
      # which rises when the kit starts using an API older VS Code lacks, not
      # whenever new types are published. Raise both when a kit release raises
      # its floor, or when this extension needs a newer API itself.
      - dependency-name: "@types/vscode"

      # @types/node majors: these types decide what Node API the code may compile
      # against, so they must not exceed the Node of the oldest VS Code this
      # extension accepts. `engines.vscode: ^1.138.0` makes that VS Code 1.138,
      # whose extension host is Electron 42.10.0 with Node 24.18.1 (`target` in
      # microsoft/vscode's .npmrc at the 1.138.0 tag, then Electron's release
      # list). A bump past that passes CI — nothing reaches for a newer API *yet*
      # — which is precisely why CI cannot be what catches it. Same rule as
      # @types/vscode, where the types floor is also the ceiling. Revisit when
      # the floor moves, and look up the new floor's Node the same way.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

      # markdown-it majors: it finds the diagram blocks for export and the
      # editor commands, and must parse as VS Code's Markdown preview does.
      # The preview uses markdown-it ^14 (extensions/markdown-language-features
      # in microsoft/vscode), so stay on 14 until VS Code moves.
      - dependency-name: markdown-it
        update-types:
          - version-update:semver-major

  # Actions are pinned to commit SHAs, which a person cannot reasonably keep current by
  # hand. Dependabot reads the version from the trailing comment and updates both, so the
  # pinning stays a safeguard rather than becoming a way to stay on old code forever.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
