yntax.</text><text x="5" y="134.60" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">- Upgrade PlantUML to the latest version.</text><text x="5" y="146.60" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">- Consult the documentation: https://plantuml.com</text><text x="5" y="158.60" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text></g></svg>